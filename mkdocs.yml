site_name: Документационный портал # Название сайта
site_description: Док портал обо всем # Описание сайта, добавляется в meta-теги
copyright: '2026'
theme: # Тема сайта, информация о ее параметрах
  name: material # Название темы
  logo: images/logo.svg # Ссылка на логотип сайта, логотип добавляется в папку `docs/images`
  font:
    text: Lora # Шрифт текста
    code: Montserrat # Шрифт для текста кода (формально). У меня используется для заголовков
  language: ru # Язык
  palette: # Настройки светлой и тёмной тем
    # Настройки моей собственной темы
    - scheme: myscheme
      toggle:
        icon: material/shield-moon # Иконка для активации светлой темы
        name: Во тьму # Всплывающий текст-подсказка
    # Настройки светлой темы - отключена
    #- scheme: default 
    #  toggle:
    #    icon: material/weather-sunny # Иконка для активации светлой темы
    #    name: Выключить солнышко # Всплывающий текст-подсказка
    #  primary: light blue # Основной цвет
    #  accent: pink # Акцентный цвет
      # вы можете использовать любой цвет из списка: 
      # red; pink; purple; deep purple; indigo; blue; light blue; cyan; teal; 
      # green; light green; lime; yellow; amber; orange; deep orange; brown; 
      # grey; blue grey; black; white

    # Настройки тёмной темы
    - scheme: slate
      toggle:
        icon: material/shield-sun
        name: На свет
      primary: deep purple
      accent: blue
  features: # настройки функциональностей темы
    #- navigation.sections # Добавление разделов верхнего уровня в боковом меню, отключение спойлеров в боковом меню
    - navigation.path # Хлебные крошки
    - navigation.indexes # Позволяет создавать корневые страницы разделов меню. Корневая страница должна лежать в папке раздела и называться index.md. Пример использования корневых страниц приведен ниже в настройках nav
    #- navigation.tabs # Верхнее меню
    #- navigation.tabs.sticky # Фиксация верхнего меню
    #- navigation.expand # Разворачивает спойлеры в левом меню по умолчанию
    #- toc.integrate # Фиксирует оглавление страницы в левом меню
    - navigation.instant # Функция быстрой загрузки страниц
    - navigation.top # Добавляет кнопку «к началу» для быстрой обратной прокрутки страницы
    - search.suggest # Подсказки при вводе поискового запроса
    - search.highlight # Подсветка результатов поиска в тексте страницы
    - content.code.copy # Кнопка копирования в блоке кода

nav: # Структура сайта
- О сайте: index.md
- Руководства по работе с LLM:
  - Instructions/LLMs/index.md
  - Методика ведения чата с LLM: Instructions/LLMs/LLM-general-instruction.md
  - Формирование первичного промпта: Instructions/LLMs/prompt-template.md
  - Улучшение первичного промпта: Instructions/LLMs/meta-prompts.md
  - Оценка качества результата: Instructions/LLMs/QA.md
  - Техники улучшения результата: Instructions/LLMs/quality-improvement-technics.md
  - Техника смены темы: Instructions/LLMs/pivot.md
  - Формирование саммари: Instructions/LLMs/summary.md
  - Оценка качества саммари: Instructions/LLMs/summary-QA.md
- Руководства по Desktop-приложению Telegram:
  - Instructions/Telegram/index.md
  - Управление кэшем Telegram: Instructions/Telegram/sostarovoitov-instruction.md
- Руководства по работе с Нотсапп:
  - Instructions/Notesapp/index.md
  - Редактирование заметки: Instructions/Notesapp/notesapp-instruction.md
  - API дока Swagger: Instructions/Notesapp/notesapp-API-swagger.md
  - API дока Redoc: Instructions/Notesapp/notesapp-API-redoc.md
- Облако тегов: tags.md

markdown_extensions: # Расширения markdown
  - admonition # Поддержка информационных панелей (сообщений типа «Внимание», «Совет», «Примечание», etc.)
  - footnotes # Поддержка встроенных сносок на страницах
  - attr_list # Использование html-атрибутов и CSS в элементах markdown
  - md_in_html # Поддержка markdown внутри html
  - def_list # Поддержка списков определений
  - pymdownx.mark  # Для выделения текста ==вот так==
  - pymdownx.caret # Для подчеркивания ^^вот так^^ и надстрочных знаков
  - pymdownx.blocks.caption #для подписей под рисунками (тестить)
  - pymdownx.tasklist:        # Для использования чек-боксов
      custom_checkbox: true   # Делает чек-боксы красивыми (в стиле Material)
      clickable_checkbox: true # Делает чек-боксы кликабельными
  - pymdownx.tabbed: # Использование вкладок (табов)
      alternate_style: true
  - pymdownx.details # Использование спойлеров (катов)
  - pymdownx.highlight: # Подсветка синтаксиса в блоках кода
      anchor_linenums: true
  - pymdownx.superfences # Поддержка вложенных блоков кода
  - pymdownx.emoji: # Иконки и эмодзи
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg  
  - pymdownx.snippets:
      base_path:
        - docs
  - toc:
      permalink: "#"

plugins:
  - search
  - tags:
      tags_allowed:
      - help
      - index
      - whatever
  - glightbox:
  - swagger-ui-tag
  - redoc-tag
  - plantuml:
      puml_url: https://www.plantuml.com/plantuml/
      theme:
          enabled: false

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/starovoitov_so